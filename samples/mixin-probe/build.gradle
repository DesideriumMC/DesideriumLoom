plugins { id 'agency.highlysuspect.voldeloom' }
group = 'dev.desiderium.samples'
version = '0.1.0-p1'
java.toolchain.languageVersion = JavaLanguageVersion.of(11)
tasks.withType(JavaCompile).configureEach {
    options.release = 6
    options.compilerArgs += ['-proc:none']
}
configurations { bootstrap }
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/'; content { includeGroup 'org.spongepowered' } }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.6.4'
    forge 'net.minecraftforge:forge:1.6.4-9.11.1.1345:universal'
    mappings 'net.minecraftforge:forge:1.6.4-9.11.1.1345:src@zip'
    compileOnly "org.spongepowered:mixin:${providers.gradleProperty('mixinVersion').getOrElse('0.8.7')}"
    bootstrap project(path: ':mixin-bootstrap', configuration: 'shadow')
}
volde.runs {
    client {
        programArg '--username=DesideriumP1'
        property 'desiderium.mixin.configs', 'mixins.desiderium.p1.json'
    }
    server {
        runDir = 'run-server'
        property 'desiderium.mixin.configs', 'mixins.desiderium.p1.json'
    }
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn ':mixin-bootstrap:shadowJar', tasks.named('classes')
    classpath configurations.bootstrap
    args '--tweakClass=dev.desiderium.bootstrap.DesideriumTweaker'
}
tasks.named('jar') {
    manifest.attributes('DesideriumMixinConfigs': 'mixins.desiderium.p1.json')
}
